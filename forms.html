<div class="container my-4">
    <h2>Забронировать столик</h2>

    <form action="#" method="post" class="mt-4">
        <div class="form-row">
            <div class="form-group col-md-6">
                <label for="name">Имя</label>
                <input type="text" class="form-control" id="name" placeholder="Введите имя" required>
            </div>
            <div class="form-group col-md-6">
                <label for="phone">Телефон</label>
                <input type="tel" class="form-control" id="phone" placeholder="+7 (___) ___-__-__" required>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group col-md-4">
                <label for="date">Дата</label>
                <input type="date" class="form-control" id="date" required>
            </div>
            <div class="form-group col-md-4">
                <label for="time">Время</label>
                <input type="time" class="form-control" id="time" required>
            </div>
            <div class="form-group col-md-4">
                <label for="guests">Кол-во гостей</label>
                <select class="form-control" id="guests">
                    <option>1</option>
                    <option selected>2</option>
                    <option>3</option>
                    <option>4</option>
                    <option>5+</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label for="comment">Пожелания</label>
            <textarea class="form-control" id="comment" rows="3" placeholder="Столик у окна, детское кресло..."></textarea>
        </div>

        <div class="form-group form-check">
            <input type="checkbox" class="form-check-input" id="agree" required>
            <label class="form-check-label" for="agree">Согласен с обработкой персональных данных</label>
        </div>

        <button type="submit" class="btn btn-danger">Забронировать</button>
    </form>
</div>
